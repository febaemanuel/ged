version: '3.8'

# ============================================
# Docker Compose - DESENVOLVIMENTO
# Sistema GED EBSERH
# ============================================
#
# Uso:
#   docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Features de desenvolvimento:
# - Hot reload (volume mount do código)
# - Debug habilitado
# - Logs verbose
# - Ports expostos para debug
# ============================================

services:
  web:
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: 1
    volumes:
      # Mount do código para hot-reload
      - .:/app
      # Mas exclui alguns diretórios
      - /app/__pycache__
      - /app/.pytest_cache
    command: ["flask", "run", "--host=0.0.0.0", "--port=5000", "--reload", "--debugger"]
    stdin_open: true
    tty: true

  db:
    ports:
      # Expõe porta do PostgreSQL para acesso direto
      - "5432:5432"
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
